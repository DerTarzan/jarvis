[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Modularer, lokaler KI-Sprachassistent (Ollama, faster-whisper, Piper)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "rich>=13.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Lokale Sprachkette (Mikrofon, STT, TTS)
audio = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "piper-tts>=1.3",
]
wake-word = [
    "openwakeword>=0.6",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B027"]  # leere optionale Hooks in Basisklassen sind Absicht
